kind = "web"
previewPath = "/"
title = "Football Fixtures"
description = "Browse past and upcoming football fixtures by date and open each match for round, standings, lineups, analysis, preview, events, and odds where available."
version = "1.0.0"
id = "artifacts/football-fixtures"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21723

[services.development]
run = "pnpm --filter @workspace/football-fixtures run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/football-fixtures", "run", "build" ]
serve = "static"
publicDir = "artifacts/football-fixtures/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21723"
BASE_PATH = "/"
